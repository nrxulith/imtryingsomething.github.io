<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slither Snack</title>
    <style>
      :root {
        --bg1: #0a1220;
        --bg2: #091521;
        --hud: rgba(14, 18, 24, 0.52);
        --panel: rgba(17, 23, 35, 0.9);
        --line: rgba(255,255,255,0.12);
        --green: #65f0a8;
        --green-dark: #2abb78;
        --green-soft: #d7ffe9;
        --red: #ff5872;
        --red-soft: #ffb2be;
        --text: #edf6ff;
        --muted: #b8c7d8;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, #12253f 0%, var(--bg1) 35%, var(--bg2) 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body { position: relative; }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }

      .hud {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 10;
        pointer-events: none;
      }

      .chip {
        min-width: 110px;
        background: var(--hud);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px 14px;
        text-align: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      }

      .chip small {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .chip strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
        line-height: 1;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(236,243,255,0.82);
        z-index: 10;
        pointer-events: none;
        white-space: nowrap;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(7, 12, 18, 0.45);
        z-index: 30;
        backdrop-filter: blur(6px);
      }

      .overlay.hidden { display: none; }

      .card {
        width: min(430px, calc(100vw - 28px));
        background: linear-gradient(160deg, rgba(22, 37, 52, 0.96), rgba(12, 18, 29, 0.96));
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 28px;
        box-shadow: 0 28px 90px rgba(0,0,0,0.45);
        padding: 30px 26px 24px;
        text-align: center;
      }

      .emoji {
        font-size: clamp(38px, 9vw, 54px);
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(30px, 7vw, 46px);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 auto 24px;
        max-width: 300px;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 14px;
        padding: 14px 24px;
        background: linear-gradient(180deg, #78f7b5, #58df98);
        color: #0d1f17;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(87, 219, 133, 0.3);
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover { transform: translateY(-2px); filter: brightness(1.03); }
      button:active { transform: translateY(0); }

      @media (max-width: 520px) {
        .chip { min-width: 95px; padding: 9px 10px; }
        .chip strong { font-size: 20px; }
        .hint { letter-spacing: 0.04em; font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Snake game"></canvas>

    <div class="hud" aria-live="polite">
      <div class="chip"><small>Apples</small><strong id="score">0</strong></div>
      <div class="chip"><small>Best</small><strong id="best">0</strong></div>
    </div>

    <div class="hint">Move the mouse to steer • arrow keys / WASD also work</div>

    <div class="overlay" id="overlay">
      <div class="card">
        <div class="emoji">🐍</div>
        <h1 id="title">Slither Snack</h1>
        <p id="message">A smooth, free-roaming snake. Chase apples, grow longer, and avoid your own tail.</p>
        <button id="startBtn">Start game</button>
      </div>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('overlay');
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');

        const WORLD = { width: 1900, height: 1200 };
        const PLAYER_RADIUS = 12;
        const APPLE_RADIUS = 10;
        const MAX_APPLES = 28;

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let score = 0;
        let best = Number(localStorage.getItem('slitherSnackBest') || 0);
        let running = false;
        let lastTime = 0;
        let pointer = { x: width * 0.5, y: height * 0.5 };
        let targetHeading = -Math.PI / 2;
        let heading = -Math.PI / 2;
        let snake = null;
        let apples = [];

        bestEl.textContent = String(best);

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resize);
        resize();

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function angleDiff(a, b) {
          return Math.atan2(Math.sin(b - a), Math.cos(b - a));
        }

        function resetGame() {
          heading = -Math.PI / 2;
          targetHeading = heading;
          snake = {
            x: WORLD.width * 0.5,
            y: WORLD.height * 0.5,
            radius: PLAYER_RADIUS,
            trail: [{ x: WORLD.width * 0.5, y: WORLD.height * 0.5, distance: 0 }],
            currentDistance: 0,
            length: 120,
            speed: 180
          };

          apples = [];
          while (apples.length < MAX_APPLES) spawnApple();
          score = 0;
          scoreEl.textContent = '0';
        }

        function spawnApple() {
          apples.push({
            x: 60 + Math.random() * (WORLD.width - 120),
            y: 60 + Math.random() * (WORLD.height - 120),
            phase: Math.random() * Math.PI * 2,
            pulse: 0.7 + Math.random() * 1.6
          });
        }

        function setPointerFromEvent(event) {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          const dx = pointer.x - width * 0.5;
          const dy = pointer.y - height * 0.5;
          if (Math.hypot(dx, dy) > 6) {
            targetHeading = Math.atan2(dy, dx);
          }
        }

        canvas.addEventListener('pointermove', setPointerFromEvent);
        canvas.addEventListener('pointerdown', setPointerFromEvent);

        const keyState = {};

        window.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) event.preventDefault();
          keyState[key] = true;

          if (!running && (key === 'enter' || key === ' ')) {
            startGame();
          }
        });

        window.addEventListener('keyup', (event) => {
          keyState[event.key.toLowerCase()] = false;
        });

        function updateHeading() {
          const controlX = (keyState.d || keyState.arrowright ? 1 : 0) - (keyState.a || keyState.arrowleft ? 1 : 0);
          const controlY = (keyState.s || keyState.arrowdown ? 1 : 0) - (keyState.w || keyState.arrowup ? 1 : 0);

          if (controlX !== 0 || controlY !== 0) {
            targetHeading = Math.atan2(controlY, controlX);
          }

          const dx = pointer.x - width * 0.5;
          const dy = pointer.y - height * 0.5;
          if (Math.hypot(dx, dy) > 8) {
            targetHeading = Math.atan2(dy, dx);
          }

          const maxTurn = 1.75;
          const diff = angleDiff(heading, targetHeading);
          heading += clamp(diff, -maxTurn, maxTurn);
        }

        function getPointAtDistance(distance) {
          if (!snake) return { x: WORLD.width * 0.5, y: WORLD.height * 0.5 };

          for (let i = 0; i < snake.trail.length - 1; i++) {
            const a = snake.trail[i];
            const b = snake.trail[i + 1];
            if (a.distance <= distance && b.distance >= distance) {
              const span = b.distance - a.distance || 1;
              const t = (distance - a.distance) / span;
              return {
                x: a.x + (b.x - a.x) * t,
                y: a.y + (b.y - a.y) * t
              };
            }
          }

          return snake.trail[snake.trail.length - 1];
        }

        function updateSnake(dt) {
          if (!snake) return;

          updateHeading();

          const speed = snake.speed + Math.min(score * 2.2, 80);
          const oldX = snake.x;
          const oldY = snake.y;
          snake.x += Math.cos(heading) * speed * dt;
          snake.y += Math.sin(heading) * speed * dt;
          snake.currentDistance += Math.hypot(snake.x - oldX, snake.y - oldY);

          snake.trail.unshift({ x: snake.x, y: snake.y, distance: snake.currentDistance });

          while (snake.trail.length > 1 && snake.currentDistance - snake.trail[snake.trail.length - 1].distance > snake.length + 80) {
            snake.trail.pop();
          }

          if (snake.x < 12 || snake.y < 12 || snake.x > WORLD.width - 12 || snake.y > WORLD.height - 12) {
            endGame();
            return;
          }

          const bodySampleStep = 14;
          for (let i = bodySampleStep; i < snake.length; i += bodySampleStep) {
            const p = getPointAtDistance(snake.currentDistance - i);
            if (Math.hypot(p.x - snake.x, p.y - snake.y) < snake.radius * 1.55) {
              endGame();
              return;
            }
          }

          for (let i = apples.length - 1; i >= 0; i--) {
            const apple = apples[i];
            if (Math.hypot(apple.x - snake.x, apple.y - snake.y) < snake.radius + APPLE_RADIUS + 4) {
              apples.splice(i, 1);
              score += 1;
              scoreEl.textContent = String(score);
              snake.length += 14;
              while (apples.length < MAX_APPLES) spawnApple();
            }
          }
        }

        function drawBackground(cameraX, cameraY) {
          const gradient = ctx.createLinearGradient(0, 0, width, height);
          gradient.addColorStop(0, '#13283f');
          gradient.addColorStop(1, '#091923');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = 'rgba(121, 187, 255, 0.12)';
          ctx.lineWidth = 1;
          const grid = 32;
          for (let x = (-cameraX % grid) - grid; x < width + grid; x += grid) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = (-cameraY % grid) - grid; y < height + grid; y += grid) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(140, 191, 255, 0.16)';
          ctx.lineWidth = 2;
          ctx.strokeRect(-cameraX, -cameraY, WORLD.width, WORLD.height);
        }

        function drawApple(cameraX, cameraY, timestamp) {
          for (const apple of apples) {
            const x = apple.x - cameraX;
            const y = apple.y - cameraY + Math.sin(timestamp * 0.004 + apple.phase) * 1.4;

            if (x < -30 || x > width + 30 || y < -30 || y > height + 30) continue;

            ctx.save();
            ctx.translate(x, y);
            ctx.shadowColor = 'rgba(255, 90, 110, 0.9)';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ff5872';
            ctx.beginPath();
            ctx.arc(0, 1, APPLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffb2be';
            ctx.beginPath();
            ctx.ellipse(-3, -2, 3, 4.8, -0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#6BE094';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.quadraticCurveTo(2, -14, 7, -11);
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawSnake(cameraX, cameraY) {
          if (!snake) return;

          const bodyPoints = [];
          for (let i = 0; i < snake.length; i += 8) {
            const p = getPointAtDistance(snake.currentDistance - i);
            bodyPoints.push({ x: p.x - cameraX, y: p.y - cameraY });
          }

          if (bodyPoints.length > 1) {
            ctx.beginPath();
            ctx.moveTo(bodyPoints[0].x, bodyPoints[0].y);
            for (let i = 1; i < bodyPoints.length; i++) {
              ctx.lineTo(bodyPoints[i].x, bodyPoints[i].y);
            }
            ctx.strokeStyle = '#1b8e5e';
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(bodyPoints[0].x, bodyPoints[0].y);
            for (let i = 1; i < bodyPoints.length; i++) {
              ctx.lineTo(bodyPoints[i].x, bodyPoints[i].y);
            }
            ctx.strokeStyle = '#43d990';
            ctx.lineWidth = 18;
            ctx.stroke();
          }

          const hx = snake.x - cameraX;
          const hy = snake.y - cameraY;

          ctx.fillStyle = '#62f1a8';
          ctx.beginPath();
          ctx.arc(hx, hy, snake.radius, 0, Math.PI * 2);
          ctx.fill();

          const eyeOffset = 5;
          const eyeX = Math.cos(heading) * 5;
          const eyeY = Math.sin(heading) * 5;

          for (const side of [-1, 1]) {
            const ex = hx + eyeX + Math.cos(heading + side * 0.8) * eyeOffset;
            const ey = hy + eyeY + Math.sin(heading + side * 0.8) * eyeOffset;
            ctx.fillStyle = '#f2fff7';
            ctx.beginPath();
            ctx.arc(ex, ey, 2.7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#08261b';
            ctx.beginPath();
            ctx.arc(ex + 0.9, ey + 0.5, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function draw(timestamp) {
          const cameraX = clamp(snake ? snake.x - width * 0.5 : 0, 0, WORLD.width - width);
          const cameraY = clamp(snake ? snake.y - height * 0.5 : 0, 0, WORLD.height - height);

          drawBackground(cameraX, cameraY);
          drawApple(cameraX, cameraY, timestamp);
          drawSnake(cameraX, cameraY);
        }

        function gameLoop(timestamp) {
          const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.04);
          lastTime = timestamp;

          if (running) {
            updateSnake(dt);
          }

          draw(timestamp);
          requestAnimationFrame(gameLoop);
        }

        function startGame() {
          resetGame();
          running = true;
          overlay.classList.add('hidden');
          lastTime = performance.now();
        }

        function endGame() {
          if (!running) return;
          running = false;

          if (score > best) {
            best = score;
            localStorage.setItem('slitherSnackBest', String(best));
            bestEl.textContent = String(best);
          }

          titleEl.textContent = 'Game over';
          messageEl.textContent = `You scored ${score} ${score === 1 ? 'apple' : 'apples'} — want another run?`;
          startBtn.textContent = 'Play again';
          overlay.classList.remove('hidden');
        }

        startBtn.addEventListener('click', () => {
          startGame();
        });

        resetGame();
        requestAnimationFrame(gameLoop);
      })();
    </script>
  </body>
</html>
