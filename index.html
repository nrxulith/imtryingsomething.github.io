<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2c">
  <title>Slither Snack</title>
  <style>
    :root{color-scheme:dark;--bg:#101b2c;--text:#f5f7fb;--muted:#b7c6d9;--panel:rgba(17,27,43,.95);--line:rgba(255,255,255,.17);--hud:rgba(16,27,44,.84);--accent:#82ed9e;--accentText:#102018;--soft:rgba(145,165,190,.18)}
    html[data-theme="light"]{color-scheme:light;--bg:#e8f3e9;--text:#20332a;--muted:#536b5d;--panel:rgba(248,255,247,.97);--line:rgba(36,73,48,.2);--hud:rgba(247,255,244,.9);--accent:#52d38a;--accentText:#10281b;--soft:rgba(46,91,60,.12)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;z-index:2;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}.pill{min-width:70px;padding:8px 11px;border:1px solid var(--line);border-radius:14px;background:var(--hud);text-align:center;backdrop-filter:blur(10px);box-shadow:0 6px 24px #0002}.pill small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.pill strong{display:block;margin-top:2px;font-size:19px;line-height:1.1}
    .top-actions{position:fixed;z-index:4;top:max(14px,env(safe-area-inset-top));right:14px}.ui-button{border:1px solid var(--line);border-radius:13px;padding:9px 13px;color:var(--text);background:var(--hud);font:700 13px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(10px)}.ui-button:hover,.game-button:hover{filter:brightness(1.08);transform:translateY(-1px)}#shopButton{position:fixed;z-index:4;top:max(14px,env(safe-area-inset-top));left:14px;display:none}#shopButton.visible{display:block}
    .hint{position:fixed;z-index:2;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;color:var(--muted);font-size:12px;text-align:center;text-shadow:0 1px 5px #0005;pointer-events:none}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:18px;background:rgba(5,10,18,.48);backdrop-filter:blur(6px)}html[data-theme="light"] .overlay{background:rgba(40,58,43,.23)}.overlay.hidden{display:none}
    .card{width:min(470px,100%);max-height:91vh;overflow:auto;padding:27px 23px 22px;border:1px solid var(--line);border-radius:25px;background:var(--panel);box-shadow:0 24px 80px #0005;text-align:center}.emoji{font-size:40px}h1{margin:8px 0;font-size:clamp(28px,7vw,39px);letter-spacing:-.045em}p{max-width:360px;margin:0 auto 18px;color:var(--muted);line-height:1.5}.mode-buttons,.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action-buttons{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));margin-top:13px}.game-button{border:0;border-radius:13px;padding:12px 13px;background:var(--accent);color:var(--accentText);font:800 14px system-ui,sans-serif;cursor:pointer;transition:transform .12s,filter .12s}.game-button span{display:block;margin-top:4px;font-size:11px;font-weight:600;opacity:.76}.game-button.secondary{color:var(--text);background:var(--soft);border:1px solid var(--line)}.hidden{display:none!important}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0;text-align:left}.setting{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:13px;font-weight:650;cursor:pointer}.setting input{accent-color:#42c97b;width:17px;height:17px}.upgrade-list{display:grid;gap:9px;margin:15px 0;text-align:left}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--soft)}.upgrade strong{display:block}.upgrade small{display:block;margin-top:3px;color:var(--muted);line-height:1.3}.upgrade .game-button{flex:0 0 auto;padding:9px 10px;font-size:12px}.upgrade .game-button:disabled{opacity:.55;cursor:default;transform:none}
    @media(max-width:540px){.top-actions{right:8px}#shopButton{left:8px}.pill{min-width:58px;padding:7px 8px}.pill strong{font-size:17px}.hint{font-size:11px}.card{padding:23px 16px 18px}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Snake game. Steer with pointer or arrow keys."></canvas>
  <div class="hud" aria-live="polite"><div class="pill"><small>Apples</small><strong id="score">0</strong></div><div class="pill"><small>Best</small><strong id="best">0</strong></div><div class="pill hidden" id="pointsPill"><small>Glow points</small><strong id="points">0</strong></div></div>
  <button class="ui-button" id="shopButton">✨ Buffs</button><div class="top-actions"><button class="ui-button" id="themeButton">☀️ Light</button></div>
  <div class="hint" id="hint">Move your pointer to steer · Arrow keys / WASD also work</div>
  <div class="overlay" id="mainOverlay"><section class="card">
    <div class="emoji">🐍</div><h1 id="title">Slither Snack</h1><p id="message">Choose your way to play.</p>
    <div class="mode-buttons" id="modeButtons">
      <button class="game-button" data-mode="fluid">Fluid Classic<span>Free steering, no hazards</span></button>
      <button class="game-button" data-mode="grid">Grid Classic<span>Original turn-by-turn snake</span></button>
      <button class="game-button" data-mode="wild">Wild Grove<span>Build a custom hazard run</span></button>
    </div>
    <div id="wildSetup" class="hidden"><p>Choose which hazards to include in this run:</p><div class="settings">
      <label class="setting"><input type="checkbox" data-hazard="meteors" checked> ☄️ Meteors</label>
      <label class="setting"><input type="checkbox" data-hazard="trees" checked> 🌳 Trees</label>
      <label class="setting"><input type="checkbox" data-hazard="bird" checked> 🦅 Hunting bird</label>
      <label class="setting"><input type="checkbox" data-hazard="thorns"> 🌵 Thorn patches</label>
      <label class="setting"><input type="checkbox" data-hazard="wind"> 💨 Gusts</label>
    </div><div class="action-buttons"><button class="game-button" id="startWild">Start Wild Grove</button><button class="game-button secondary" id="backModes">Back</button></div></div>
    <div class="action-buttons hidden" id="resultActions"><button class="game-button" id="againButton">Play again</button><button class="game-button secondary" id="chooseButton">Choose mode</button><button class="game-button secondary hidden" id="deathShopButton">Spend glow points</button></div>
  </section></div>
  <div class="overlay hidden" id="shopOverlay"><section class="card"><div class="emoji">✨</div><h1>Wild buffs</h1><p>Apples collected in Wild Grove earn glow points. Buffs persist between runs; they never apply to grid classic.</p><div class="upgrade-list" id="upgradeList"></div><button class="game-button secondary" id="closeShop">Done</button></section></div>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
  const scoreEl=$('score'),bestEl=$('best'),pointsEl=$('points'),pointsPill=$('pointsPill'),mainOverlay=$('mainOverlay'),shopOverlay=$('shopOverlay'),titleEl=$('title'),messageEl=$('message'),modeButtons=$('modeButtons'),wildSetup=$('wildSetup'),resultActions=$('resultActions'),shopButton=$('shopButton'),hint=$('hint'),themeButton=$('themeButton'),upgradeList=$('upgradeList');
  const APPLE_R=14,SPACING=7,GRID=24,START_LENGTH=120;
  const hazards={meteors:true,trees:true,bird:true,thorns:false,wind:false};
  const buffInfo=[
    {id:'dash',name:'Comet dash',cost:8,desc:'Space / Shift dashes. Your body visibly compresses during the burst.'},
    {id:'thin',name:'Little noodle',cost:5,desc:'Slimmer Wild Grove snake with a smaller collision radius.'},
    {id:'magnet',name:'Apple breeze',cost:7,desc:'Nearby apples drift gently toward you.'},
    {id:'shield',name:'Sturdy scales',cost:12,desc:'Survive one hazard or body collision per run.'},
    {id:'longtail',name:'Long starter',cost:10,desc:'Begin Wild Grove runs with a longer body and bonus points.'}
  ];
  let width=innerWidth,height=innerHeight,dpr=1,mode='fluid',running=false,lastTime=0,score=0,best=0,glowPoints=0,snake=null,apples=[],trees=[],thorns=[],meteors=[],bird=null,heading=-Math.PI/2,targetHeading=-Math.PI/2,pointer={x:width/2,y:height/2},keys={},eventTimer=6,dashTimer=0,dashCooldown=0,gridSnake=[],gridApple=null,gridDir={x:1,y:0},gridNext={x:1,y:0},gridAccumulator=0,shopWasRunning=false,shieldReady=false;
  function read(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
  let buffs=read('slitherBuffs',{dash:false,thin:false,magnet:false,shield:false,longtail:false});if(!buffs||typeof buffs!=='object')buffs={dash:false,thin:false,magnet:false,shield:false,longtail:false};
  const legacyBest=Number(read('slither-best',0))||0;best=Math.max(Number(read('slitherBestClassic',0))||0,Number(read('slitherBestWild',0))||0,legacyBest);glowPoints=Number(read('slitherGlowPoints',0))||0;
  document.documentElement.dataset.theme=read('slitherTheme','dark')==='light'?'light':'dark';bestEl.textContent=best;pointsEl.textContent=glowPoints;
  function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}
  function setThemeLabel(){const light=document.documentElement.dataset.theme==='light';themeButton.textContent=light?'🌙 Dark':'☀️ Light';document.querySelector('meta[name="theme-color"]').content=light?'#e8f3e9':'#101b2c'}
  themeButton.addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;write('slitherTheme',t);setThemeLabel()});setThemeLabel();
  function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(snake){snake.x=clamp(snake.x,24,Math.max(24,width-24));snake.y=clamp(snake.y,24,Math.max(24,height-24))}if(mode==='grid')initGridBoard();if(mode==='wild'&&hazards.trees&&running)makeTrees()}
  addEventListener('resize',resize);resize();
  // Pointer motion updates a direction, not a point the snake continually circles.
  function steerFromPointer(e){pointer={x:e.clientX,y:e.clientY};if(running&&(mode==='fluid'||mode==='wild')&&snake){const dx=pointer.x-snake.x,dy=pointer.y-snake.y;if(Math.hypot(dx,dy)>20)targetHeading=Math.atan2(dy,dx)}}
  canvas.addEventListener('pointermove',steerFromPointer);canvas.addEventListener('pointerdown',steerFromPointer);
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(mode==='grid'&&running)setGridDirection(k);if(running&&(mode==='wild')&&buffs.dash&&(k===' '||k==='shift')&&dashCooldown<=0){dashTimer=1.05;dashCooldown=5}});
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={}});
  function spawnApple(){let x=width/2,y=height/2,tries=0;do{x=APPLE_R+Math.random()*Math.max(1,width-APPLE_R*2);y=APPLE_R+Math.random()*Math.max(1,height-APPLE_R*2);tries++}while(tries<50&&((hazards.trees&&trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.r+APPLE_R+10))||(hazards.thorns&&thorns.some(t=>Math.hypot(x-t.x,y-t.y)<t.r+APPLE_R+10))));return{x,y,phase:Math.random()*Math.PI*2}}
  function makeTrees(){trees=[];for(let i=0;i<Math.min(8,Math.floor(width*height/95000));i++){let x,y,tries=0;do{x=35+Math.random()*Math.max(1,width-70);y=50+Math.random()*Math.max(1,height-100);tries++}while(tries<35&&(Math.hypot(x-width/2,y-height/2)<130||trees.some(t=>Math.hypot(x-t.x,y-t.y)<75)));trees.push({x,y,r:15+Math.random()*7})}}
  function makeThorns(){thorns=[];for(let i=0;i<Math.min(7,Math.floor(width*height/115000));i++){let x,y,tries=0;do{x=35+Math.random()*Math.max(1,width-70);y=50+Math.random()*Math.max(1,height-100);tries++}while(tries<30&&(Math.hypot(x-width/2,y-height/2)<145||thorns.some(t=>Math.hypot(x-t.x,y-t.y)<75)));thorns.push({x,y,r:18+Math.random()*7,phase:Math.random()*6})}}
  function resetFluid(nextMode){mode=nextMode;score=0;scoreEl.textContent='0';heading=targetHeading=-Math.PI/2;const long=buffs.longtail&&mode==='wild';snake={x:width/2,y:height/2,radius:mode==='wild'&&buffs.thin?8:11,length:START_LENGTH+(long?70:0),distance:0,trail:[]};for(let i=0;i<=Math.ceil((snake.length+SPACING*4)/SPACING);i++){const back=i*SPACING;snake.trail.push({x:snake.x-Math.cos(heading)*back,y:snake.y-Math.sin(heading)*back,d:-back})}trees=[];thorns=[];meteors=[];bird=null;eventTimer=6;dashTimer=0;dashCooldown=0;shieldReady=mode==='wild'&&buffs.shield;if(mode==='wild'){if(hazards.trees)makeTrees();if(hazards.thorns)makeThorns();if(hazards.bird)bird={x:width*.15,y:height*.15,r:17,swoop:5,phase:'stalk',angle:0}}apples=[];const count=clamp(Math.floor(width*height/56000),5,12);for(let i=0;i<count;i++)apples.push(spawnApple());pointsPill.classList.toggle('hidden',mode!=='wild');shopButton.classList.toggle('visible',mode==='wild');hint.textContent=mode==='wild'?'Move pointer / use keys · Space/Shift dash if unlocked':'Move pointer to steer · Arrow keys / WASD also work'}
  function initGridBoard(){const cols=Math.max(8,Math.floor(width/GRID)),rows=Math.max(8,Math.floor(height/GRID));if(!gridSnake.length){const cx=Math.floor(cols/2),cy=Math.floor(rows/2);gridSnake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];gridDir={x:1,y:0};gridNext={x:1,y:0};}else gridSnake=gridSnake.map(p=>({x:clamp(p.x,0,cols-1),y:clamp(p.y,0,rows-1)}));if(!gridApple||gridApple.x>=cols||gridApple.y>=rows)spawnGridApple(cols,rows)}
  function spawnGridApple(cols=Math.max(8,Math.floor(width/GRID)),rows=Math.max(8,Math.floor(height/GRID))){let p;do{p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(gridSnake.some(s=>s.x===p.x&&s.y===p.y));gridApple=p}
  function setGridDirection(k){const dirs={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};const d=dirs[k];if(d&&!(d.x===-gridDir.x&&d.y===-gridDir.y))gridNext=d}
  function resetGrid(){mode='grid';score=0;scoreEl.textContent='0';gridSnake=[];gridApple=null;gridAccumulator=0;initGridBoard();pointsPill.classList.add('hidden');shopButton.classList.remove('visible');hint.textContent='Grid Snake · Arrow keys / WASD to turn';}
  function startGame(nextMode){running=true;lastTime=performance.now();mainOverlay.classList.add('hidden');shopOverlay.classList.add('hidden');modeButtons.classList.remove('hidden');wildSetup.classList.add('hidden');resultActions.classList.add('hidden');if(nextMode==='grid')resetGrid();else resetFluid(nextMode);}
  function finishGame(){if(!running)return;running=false;const key=mode==='wild'?'slitherBestWild':mode==='grid'?'slitherBestGrid':'slitherBestClassic',prev=Number(read(key,0))||0;if(score>prev)write(key,score);best=Math.max(prev,Number(read('slitherBestClassic',0))||0,Number(read('slitherBestWild',0))||0,Number(read('slitherBestGrid',0))||0,legacyBest);bestEl.textContent=best;write('slither-best',best);if(mode==='wild'&&score){glowPoints+=score+(buffs.longtail?2:0);write('slitherGlowPoints',glowPoints);pointsEl.textContent=glowPoints}titleEl.textContent=mode==='wild'?'Wild run over!':mode==='grid'?'Grid game over':'Snake bumped!';messageEl.textContent=mode==='wild'?`You collected ${score} apples and earned ${score+(buffs.longtail?2:0)} glow points.`:`You collected ${score} ${score===1?'apple':'apples'}. Want another round?`;modeButtons.classList.add('hidden');wildSetup.classList.add('hidden');resultActions.classList.remove('hidden');$('deathShopButton').classList.toggle('hidden',mode!=='wild');mainOverlay.classList.remove('hidden')}
  function collideHazard(){if(shieldReady){shieldReady=false;return false}finishGame();return true}
  function spawnMeteor(){let x,y,tries=0;do{x=35+Math.random()*Math.max(1,width-70);y=45+Math.random()*Math.max(1,height-90);tries++}while(tries<35&&Math.hypot(x-snake.x,y-snake.y)<Math.min(145,Math.min(width,height)*.25));meteors.push({x,y,r:clamp(Math.min(width,height)*.1,34,52),warning:1.8,flash:.45,impact:false})}
  function pointAtDistance(back){const target=snake.distance-back;for(let i=0;i<snake.trail.length-1;i++){const a=snake.trail[i],b=snake.trail[i+1];if(a.d>=target&&b.d<=target){const t=(a.d-target)/Math.max(.001,a.d-b.d);return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}}return snake.trail[snake.trail.length-1]}
  function updateFluid(dt){const kx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),ky=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(kx||ky)targetHeading=Math.atan2(ky,kx);heading+=clamp(angleDiff(heading,targetHeading),-5.2*dt,5.2*dt);dashTimer=Math.max(0,dashTimer-dt);dashCooldown=Math.max(0,dashCooldown-dt);const speed=(215+Math.min(score,35)*1.3)*(dashTimer>0?1.75:1),ox=snake.x,oy=snake.y;snake.x+=Math.cos(heading)*speed*dt;snake.y+=Math.sin(heading)*speed*dt;snake.distance+=Math.hypot(snake.x-ox,snake.y-oy);snake.trail.unshift({x:snake.x,y:snake.y,d:snake.distance});while(snake.trail.length>2&&snake.distance-snake.trail[snake.trail.length-1].d>snake.length+SPACING*5)snake.trail.pop();if(snake.x<snake.radius||snake.y<snake.radius||snake.x>width-snake.radius||snake.y>height-snake.radius){collideHazard();return}
    const bodyLen=Math.min(snake.length,snake.distance+snake.length);for(let back=32;back<bodyLen;back+=10){const p=pointAtDistance(back);if(Math.hypot(p.x-snake.x,p.y-snake.y)<snake.radius*1.48){if(collideHazard())return;break}}
    if(mode==='wild'){
      if(hazards.trees)for(const t of trees)if(Math.hypot(t.x-snake.x,t.y-snake.y)<t.r+snake.radius-2){if(collideHazard())return;break}
      if(hazards.thorns)for(const t of thorns)if(Math.hypot(t.x-snake.x,t.y-snake.y)<t.r+snake.radius-2){if(collideHazard())return;break}
      if(hazards.wind){const gust=Math.sin(performance.now()*.0007)*.38;heading+=gust*dt}
      if(hazards.meteors){eventTimer-=dt;if(eventTimer<=0){spawnMeteor();eventTimer=8+Math.random()*5}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];if(!m.impact){m.warning-=dt;if(m.warning<=0){m.impact=true;if(Math.hypot(m.x-snake.x,m.y-snake.y)<m.r+snake.radius){if(collideHazard())return}}}else{m.flash-=dt;if(m.flash<=0)meteors.splice(i,1)}}}
      if(hazards.bird&&bird)updateBird(dt);
    }
    if(buffs.magnet&&mode==='wild'){for(const a of apples){const dx=snake.x-a.x,dy=snake.y-a.y,d=Math.hypot(dx,dy);if(d>snake.radius+APPLE_R+3&&d<155){a.x+=dx/d*75*dt;a.y+=dy/d*75*dt}}}
    for(let i=apples.length-1;i>=0;i--){const a=apples[i];if(Math.hypot(a.x-snake.x,a.y-snake.y)<snake.radius+APPLE_R+3){apples.splice(i,1);score++;scoreEl.textContent=score;snake.length+=14;apples.push(spawnApple())}}
  }
  function updateBird(dt){bird.swoop-=dt;const dx=snake.x-bird.x,dy=snake.y-bird.y,d=Math.hypot(dx,dy)||1;if(bird.swoop<=0&&bird.phase==='stalk'){bird.phase='dive';bird.swoop=1.15;bird.targetX=snake.x;bird.targetY=snake.y}if(bird.phase==='dive'){const tx=bird.targetX-bird.x,ty=bird.targetY-bird.y,td=Math.hypot(tx,ty)||1;bird.x+=tx/td*250*dt;bird.y+=ty/td*250*dt;if(bird.swoop<=0){bird.phase='stalk';bird.swoop=4.2+Math.random()*2}}else{bird.x+=dx/d*78*dt;bird.y+=dy/d*78*dt}if(Math.hypot(bird.x-snake.x,bird.y-snake.y)<bird.r+snake.radius){if(collideHazard())return;bird.x=clamp(bird.x+Math.cos(heading+Math.PI)*90,0,width);bird.y=clamp(bird.y+Math.sin(heading+Math.PI)*90,0,height);bird.phase='stalk';bird.swoop=4}}
  function updateGrid(dt){gridAccumulator+=dt;const interval=.14;if(gridAccumulator<interval)return;gridAccumulator-=interval;gridDir=gridNext;const cols=Math.max(8,Math.floor(width/GRID)),rows=Math.max(8,Math.floor(height/GRID)),head={x:gridSnake[0].x+gridDir.x,y:gridSnake[0].y+gridDir.y};if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||gridSnake.some((p,i)=>i<gridSnake.length-1&&p.x===head.x&&p.y===head.y)){finishGame();return}gridSnake.unshift(head);if(gridApple&&head.x===gridApple.x&&head.y===gridApple.y){score++;scoreEl.textContent=score;spawnGridApple(cols,rows)}else gridSnake.pop()}
  function drawApple(a,time){const scale=1.4,x=a.x,y=a.y+Math.sin(time*.003+a.phase)*1.5;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#ff3e59';ctx.shadowBlur=14;ctx.fillStyle='#ed4055';ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-4,6,-12,0,-10,-6);ctx.bezierCurveTo(-9,-12,-2,-12,0,-7);ctx.bezierCurveTo(3,-13,10,-11,11,-5);ctx.bezierCurveTo(13,1,4,8,0,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff9da5';ctx.beginPath();ctx.ellipse(-4,-5,2,3.8,-.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#72cf78';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(1,-14,5,-13);ctx.stroke();ctx.fillStyle='#7edc83';ctx.beginPath();ctx.ellipse(6,-12,4,2,-.4,0,Math.PI*2);ctx.fill();ctx.restore()}
  function drawTrees(){for(const t of trees){ctx.fillStyle='#67452f';ctx.fillRect(t.x-4,t.y-1,8,17);ctx.fillStyle='#1f754a';ctx.beginPath();ctx.arc(t.x,t.y-5,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#39a464';ctx.beginPath();ctx.arc(t.x-5,t.y-9,t.r*.58,0,Math.PI*2);ctx.fill()}}
  function drawThorns(time){for(const t of thorns){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(Math.sin(time*.001+t.phase)*.08);ctx.fillStyle='#547b42';ctx.beginPath();ctx.ellipse(0,0,t.r,t.r*.65,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c2df70';ctx.lineWidth=3;for(let a=0;a<8;a++){const ang=a*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(ang)*t.r*.65,Math.sin(ang)*t.r*.45);ctx.lineTo(Math.cos(ang)*(t.r+8),Math.sin(ang)*(t.r*.65+7));ctx.stroke()}ctx.restore()}}
  function drawMeteors(time){for(const m of meteors){if(!m.impact){const pulse=.1+.09*(.5+.5*Math.sin(time*.018));ctx.fillStyle=`rgba(255,58,67,${pulse})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff646b';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillText('METEOR!',m.x,m.y+4)}else{ctx.fillStyle=`rgba(255,119,45,${Math.max(0,m.flash*1.5)})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r*(1.15-m.flash*.15),0,Math.PI*2);ctx.fill()}}}
  function drawBird(){if(!bird)return;ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.atan2(snake.y-bird.y,snake.x-bird.x));ctx.fillStyle='#f0c66f';ctx.beginPath();ctx.ellipse(0,0,17,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9a6b45';ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-15,-23,-24,-10);ctx.quadraticCurveTo(-11,-9,-2,4);ctx.fill();ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-15,23,-24,10);ctx.quadraticCurveTo(-11,9,-2,-4);ctx.fill();ctx.fillStyle='#f7e4b7';ctx.beginPath();ctx.arc(7,-3,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ed8550';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(24,3);ctx.lineTo(15,5);ctx.fill();ctx.restore();if(bird.phase==='dive'){ctx.strokeStyle='rgba(255,100,90,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bird.targetX,bird.targetY,22,0,Math.PI*2);ctx.stroke()}}
  function drawFluidSnake(time){const compress=dashTimer>0?.58:1,shownLength=snake.length*compress,pts=[],count=Math.ceil(shownLength/SPACING);for(let i=0;i<=count;i++){const back=i*SPACING,p=pointAtDistance(back),before=pointAtDistance(back+2),after=pointAtDistance(Math.max(0,back-2)),tx=before.x-after.x,ty=before.y-after.y,len=Math.hypot(tx,ty)||1,nx=-ty/len,ny=tx/len,wave=Math.sin(back*.055-time*.003)*1.15*Math.min(1,back/18);pts.push({x:p.x+nx*wave,y:p.y+ny*wave})}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineCap='round';ctx.lineJoin='round';const thin=mode==='wild'&&buffs.thin;ctx.strokeStyle=mode==='wild'?'#14768b':'#147c58';ctx.lineWidth=thin?20:26;ctx.stroke();ctx.strokeStyle=mode==='wild'?'#63d8ee':'#42d996';ctx.lineWidth=thin?14:19;ctx.stroke();ctx.globalAlpha=.35;ctx.strokeStyle='#e2fff0';ctx.lineWidth=3.5;ctx.stroke();ctx.globalAlpha=1;ctx.save();ctx.translate(snake.x,snake.y);ctx.rotate(heading);ctx.fillStyle=mode==='wild'?'#70def2':'#63efa6';ctx.beginPath();ctx.ellipse(0,0,snake.radius+3,snake.radius+1,0,0,Math.PI*2);ctx.fill();for(const side of [-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(4,side*5,3.2,3.8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173626';ctx.beginPath();ctx.arc(5,side*5+.4,1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9ca6aa';ctx.beginPath();ctx.arc(-3,side*8,1.8,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#f37c96';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(snake.radius+2,0);ctx.lineTo(snake.radius+6,0);ctx.lineTo(snake.radius+8,-2);ctx.moveTo(snake.radius+6,0);ctx.lineTo(snake.radius+8,2);ctx.stroke();ctx.restore();if(shieldReady){ctx.strokeStyle='#78dfff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(snake.x,snake.y,22,0,Math.PI*2);ctx.stroke()}}
  function drawGrid(){const cols=Math.max(8,Math.floor(width/GRID)),rows=Math.max(8,Math.floor(height/GRID)),light=document.documentElement.dataset.theme==='light';ctx.fillStyle=light?'#e8f3e9':'#101b2c';ctx.fillRect(0,0,width,height);ctx.strokeStyle=light?'rgba(42,91,55,.13)':'rgba(190,216,255,.1)';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*GRID,0);ctx.lineTo(x*GRID,rows*GRID);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*GRID);ctx.lineTo(cols*GRID,y*GRID);ctx.stroke()}if(gridApple){const x=(gridApple.x+.5)*GRID,y=(gridApple.y+.5)*GRID;ctx.font=`${GRID-2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍎',x,y)}gridSnake.forEach((p,i)=>{const inset=i===0?2:3;ctx.fillStyle=i===0?'#62e99d':'#39c982';ctx.beginPath();ctx.roundRect(p.x*GRID+inset,p.y*GRID+inset,GRID-inset*2,GRID-inset*2,i===0?9:6);ctx.fill()});if(gridSnake[0]){const h=gridSnake[0],cx=(h.x+.5)*GRID,cy=(h.y+.5)*GRID;ctx.fillStyle='#143626';const ex=cx+gridDir.x*4-gridDir.y*4,ey=cy+gridDir.y*4+gridDir.x*4;ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.arc(cx+gridDir.x*4+gridDir.y*4,cy+gridDir.y*4-gridDir.x*4,2,0,Math.PI*2);ctx.fill()}}
  function draw(time){const light=document.documentElement.dataset.theme==='light',bg=ctx.createLinearGradient(0,0,width,height);bg.addColorStop(0,light?'#e9f5e8':'#14243a');bg.addColorStop(1,light?'#cce4d0':'#101b2c');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);if(mode==='grid'){drawGrid();return}ctx.fillStyle=light?'rgba(40,90,52,.09)':'rgba(217,232,255,.09)';for(let y=20;y<height;y+=38)for(let x=20;x<width;x+=38){ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill()}if(mode==='wild'){if(hazards.trees)drawTrees();if(hazards.thorns)drawThorns(time);if(hazards.meteors)drawMeteors(time);if(hazards.bird)drawBird()}for(const a of apples)drawApple(a,time);if(snake)drawFluidSnake(time);if(mode==='wild'&&buffs.dash&&running){ctx.fillStyle=light?'#20332a':'#f5f7fb';ctx.font='700 11px system-ui';ctx.textAlign='left';ctx.fillText(dashTimer>0?'BODY COMPRESSED · DASH!':dashCooldown>0?`Dash ready in ${dashCooldown.toFixed(1)}s`:'Dash ready · Space / Shift',12,height-42)}}
  function frame(time){const dt=Math.min((time-lastTime)/1000||0,.04);lastTime=time;if(running){if(mode==='grid')updateGrid(dt);else updateFluid(dt)}draw(time);requestAnimationFrame(frame)}
  function renderShop(){upgradeList.replaceChildren();for(const buff of buffInfo){const row=document.createElement('div');row.className='upgrade';const info=document.createElement('div'),name=document.createElement('strong'),desc=document.createElement('small');name.textContent=buff.name;desc.textContent=buff.desc;info.append(name,desc);const button=document.createElement('button');button.className='game-button';if(buffs[buff.id]){button.textContent='Unlocked ✓';button.disabled=true}else{button.textContent=`Unlock · ${buff.cost} ✨`;button.disabled=glowPoints<buff.cost;button.addEventListener('click',()=>{if(glowPoints<buff.cost)return;glowPoints-=buff.cost;buffs[buff.id]=true;write('slitherGlowPoints',glowPoints);write('slitherBuffs',buffs);renderShop();if(running&&mode==='wild'&&buff.id==='thin')snake.radius=8})}row.append(info,button);upgradeList.append(row)}}
  function openShop(){shopWasRunning=running;running=false;renderShop();shopOverlay.classList.remove('hidden')}shopButton.addEventListener('click',openShop);$('deathShopButton').addEventListener('click',openShop);$('closeShop').addEventListener('click',()=>{shopOverlay.classList.add('hidden');if(shopWasRunning){running=true;lastTime=performance.now()}});
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.mode==='wild'){modeButtons.classList.add('hidden');wildSetup.classList.remove('hidden');titleEl.textContent='Wild Grove';messageEl.textContent='Choose your hazards and chase a high score.'}else startGame(b.dataset.mode)}));
  $('startWild').addEventListener('click',()=>{document.querySelectorAll('[data-hazard]').forEach(c=>hazards[c.dataset.hazard]=c.checked);startGame('wild')});
  $('backModes').addEventListener('click',()=>{wildSetup.classList.add('hidden');modeButtons.classList.remove('hidden');titleEl.textContent='Slither Snack';messageEl.textContent='Choose your way to play.'});
  $('againButton').addEventListener('click',()=>{if(mode==='wild'){resultActions.classList.add('hidden');wildSetup.classList.remove('hidden');titleEl.textContent='Wild Grove';messageEl.textContent='Choose hazards for your next run.'}else startGame(mode)});
  $('chooseButton').addEventListener('click',()=>{titleEl.textContent='Slither Snack';messageEl.textContent='Choose your way to play.';resultActions.classList.add('hidden');modeButtons.classList.remove('hidden');wildSetup.classList.add('hidden')});
  resetFluid('fluid');requestAnimationFrame(frame);
})();
