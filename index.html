<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slither Snack</title>
  <style>
    :root {
      --bg: #101b2c;
      --panel: rgba(17, 27, 43, 0.9);
      --muted: #b7c6d9;
      --line: rgba(255,255,255,0.15);
      --accent: #82ed9e;
      --text: #f5f7fb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background: linear-gradient(180deg, #12233d, #0f1c2f);
    }
    .hud {
      position: fixed;
      inset: max(18px, env(safe-area-inset-top)) auto auto 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 2;
      pointer-events: none;
    }
    .pill {
      min-width: 104px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(16, 27, 44, 0.7);
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .pill small {
      display: block;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #c5d1e4;
      opacity: .8;
    }
    .pill strong {
      display: block;
      margin-top: 2px;
      font-size: 21px;
      line-height: 1.1;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(229, 236, 247, 0.9);
      font-size: 12px;
      letter-spacing: .01em;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: rgba(5, 10, 18, 0.45);
      backdrop-filter: blur(7px);
    }
    .overlay.hidden { display: none; }
    .card {
      width: min(420px, calc(100vw - 32px));
      padding: 32px 28px 26px;
      border-radius: 26px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, rgba(31,44,66,.98), rgba(16,27,44,.96));
      box-shadow: 0 30px 80px rgba(0,0,0,.42);
      text-align: center;
    }
    .emoji { font-size: 42px; }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(32px, 5vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    p {
      margin: 0 auto 22px;
      max-width: 300px;
      color: var(--muted);
      line-height: 1.6;
    }
    button {
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #102018;
      padding: 13px 24px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(130,237,158,.3);
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Snake game. Steer with the pointer or arrow keys."></canvas>

  <div class="hud" aria-live="polite">
    <div class="pill"><small>Apples</small><strong id="score">0</strong></div>
    <div class="pill"><small>Best</small><strong id="best">0</strong></div>
  </div>

  <div class="hint">Move your pointer to steer · Arrow keys / WASD also work</div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji">🐍</div>
      <h1 id="title">Slither Snack</h1>
      <p id="message">Keep the snake moving, eat the apples, and grow longer without crashing.</p>
      <button id="start">Let's slither</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const startButton = document.getElementById('start');

      const WORLD = { w: 2600, h: 1900 };
      const APPLE_R = 9;
      const DIRTY_POINT = 120;

      let width = innerWidth;
      let height = innerHeight;
      let dpr = 1;
      let running = false;
      let lastTime = 0;
      let score = 0;
      let best = 0;
      let snake;
      let apples = [];
      let heading = -Math.PI / 2;
      let targetHeading = heading;
      let pointer = { x: width / 2, y: height / 2 };
      const keys = {};

      try {
        best = Number(localStorage.getItem('slither-best')) || 0;
      } catch (e) {}
      bestEl.textContent = String(best);

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize);
      resize();

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function angleDiff(a, b) {
        return Math.atan2(Math.sin(b - a), Math.cos(b - a));
      }

      function resetGame() {
        const cx = WORLD.w / 2;
        const cy = WORLD.h / 2;
        heading = targetHeading = -Math.PI / 2;

        snake = {
          x: cx,
          y: cy,
          radius: 11,
          length: 120,
          distance: 0,
          trail: []
        };

        for (let i = 0; i <= 45; i++) {
          snake.trail.push({
            x: cx - Math.cos(heading) * i * 2,
            y: cy - Math.sin(heading) * i * 2,
            d: i * 2
          });
        }

        apples = [];
        for (let i = 0; i < 28; i++) spawnApple();
        score = 0;
        scoreEl.textContent = '0';
      }

      function spawnApple() {
        let x = 30 + Math.random() * (WORLD.w - 60);
        let y = 30 + Math.random() * (WORLD.h - 60);
        apples.push({ x, y, phase: Math.random() * Math.PI * 2 });
      }

      function pointAtDistance(back) {
        const target = snake.distance - back;
        for (let i = 0; i < snake.trail.length - 1; i++) {
          const a = snake.trail[i];
          const b = snake.trail[i + 1];
          if (a.d <= target && b.d >= target) {
            const t = (target - a.d) / Math.max(0.001, b.d - a.d);
            return {
              x: a.x + (b.x - a.x) * t,
              y: a.y + (b.y - a.y) * t
            };
          }
        }
        return snake.trail[snake.trail.length - 1];
      }

      function update(dt) {
        const horiz = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
        const vert = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);

        if (horiz || vert) {
          targetHeading = Math.atan2(vert, horiz);
        } else {
          const dx = pointer.x - width / 2;
          const dy = pointer.y - height / 2;
          if (Math.hypot(dx, dy) > 10) {
            targetHeading = Math.atan2(dy, dx);
          }
        }

        const turnRate = 4.5;
        heading += clamp(angleDiff(heading, targetHeading), -turnRate * dt, turnRate * dt);

        const speed = 165 + Math.min(score, 35) * 1.4;
        const ox = snake.x;
        const oy = snake.y;

        snake.x += Math.cos(heading) * speed * dt;
        snake.y += Math.sin(heading) * speed * dt;
        snake.distance += Math.hypot(snake.x - ox, snake.y - oy);

        snake.trail.unshift({ x: snake.x, y: snake.y, d: snake.distance });

        while (snake.trail.length > 160 && snake.distance - snake.trail[snake.trail.length - 1].d > snake.length + 80) {
          snake.trail.pop();
        }

        if (snake.x < snake.radius || snake.y < snake.radius || snake.x > WORLD.w - snake.radius || snake.y > WORLD.h - snake.radius) {
          return endGame();
        }

        for (let i = apples.length - 1; i >= 0; i--) {
          const apple = apples[i];
          if (Math.hypot(apple.x - snake.x, apple.y - snake.y) < snake.radius + APPLE_R + 4) {
            apples.splice(i, 1);
            spawnApple();
            score += 1;
            snake.length += 12;
            scoreEl.textContent = String(score);
          }
        }

        for (let back = 20; back < snake.length; back += 10) {
          const p = pointAtDistance(back);
          if (Math.hypot(p.x - snake.x, p.y - snake.y) < snake.radius * 1.35) {
            return endGame();
          }
        }
      }

      function drawApple(apple, time, camX, camY) {
        const x = apple.x - camX;
        const y = apple.y - camY + Math.sin(time * 0.003 + apple.phase) * 2.4;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = '#ff5d6f';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff6470';
        ctx.beginPath();
        ctx.arc(0, 3, APPLE_R, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffb0aa';
        ctx.beginPath();
        ctx.ellipse(-2.5, -1, 2.2, 3.5, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#8fe9a0';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(1, -8);
        ctx.quadraticCurveTo(3, -14, 8, -13);
        ctx.stroke();
        ctx.restore();
      }

      function drawSnake(camX, camY, time) {
        const points = [];
        for (let i = 0; i < 80; i++) {
          const p = pointAtDistance(i * 6);
          points.push({ x: p.x - camX, y: p.y - camY });
        }

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const body = points.map((p, i) => {
          const wave = Math.sin((i * 0.35) - time * 0.008) * 1.4;
          const nx = p.x + wave * 0.5;
          const ny = p.y + wave * 0.8;
          return { x: nx, y: ny };
        });

        ctx.beginPath();
        body.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = '#147c58';
        ctx.lineWidth = 24;
        ctx.stroke();

        ctx.beginPath();
        body.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = '#42d996';
        ctx.lineWidth = 18;
        ctx.stroke();

        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        body.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = '#d9ffe9';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.globalAlpha = 1;

        const hx = snake.x - camX;
        const hy = snake.y - camY;

        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(heading);
        ctx.fillStyle = '#5fe7a6';
        ctx.beginPath();
        ctx.ellipse(0, 0, snake.radius + 2, snake.radius + 1, 0, 0, Math.PI * 2);
        ctx.fill();

        for (const side of [-1, 1]) {
          const eyeX = 5 + side * 4;
          const eyeY = -3 + side * 1;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, 2.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#173625';
          ctx.beginPath();
          ctx.arc(eyeX + 0.8, eyeY + 0.4, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function draw(time) {
        const camX = clamp(snake.x - width / 2, 0, WORLD.w - width);
        const camY = clamp(snake.y - height / 2, 0, WORLD.h - height);

        ctx.clearRect(0, 0, width, height);

        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, '#13263f');
        bg.addColorStop(1, '#0f1d2f');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(192, 216, 255, 0.08)';
        const step = 36;
        for (let y = (-camY % step) - step; y < height + step; y += step) {
          for (let x = (-camX % step) - step; x < width + step; x += step) {
            ctx.beginPath();
            ctx.arc(x, y, 1.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.strokeStyle = 'rgba(123, 182, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-camX, -camY, WORLD.w, WORLD.h);

        for (const apple of apples) {
          drawApple(apple, time, camX, camY);
        }

        drawSnake(camX, camY, time);
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, 0.04);
        lastTime = time;

        if (running) {
          update(dt);
        }

        draw(time);
        requestAnimationFrame(frame);
      }

      function startGame() {
        resetGame();
        running = true;
        overlay.classList.add('hidden');
        lastTime = performance.now();
        pointer = { x: width / 2, y: height / 2 - 140 };
      }

      function endGame() {
        if (!running) return;
        running = false;

        if (score > best) {
          best = score;
          try { localStorage.setItem('slither-best', String(best)); } catch (e) {}
          bestEl.textContent = String(best);
        }

        titleEl.textContent = 'Snake bumped!';
        messageEl.textContent = `You ate ${score} ${score === 1 ? 'apple' : 'apples'}. Want another round?`;
        startButton.textContent = 'Play again';
        overlay.classList.remove('hidden');
      }

      startButton.addEventListener('click', startGame);
      canvas.addEventListener('pointermove', (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });
      canvas.addEventListener('pointerdown', (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();
        keys[key] = true;
        if (!running && (key === 'enter' || key === ' ')) startGame();
      });
      window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      resetGame();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
