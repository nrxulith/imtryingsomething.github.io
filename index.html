<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2c"><title>Slither Snack</title>
<style>
:root{color-scheme:dark;--bg:#101b2c;--text:#f5f7fb;--muted:#b7c6d9;--panel:rgba(17,27,43,.95);--line:#ffffff2b;--hud:#101b2cdb;--accent:#82ed9e;--accentText:#102018;--soft:#ffffff18}html[data-theme=light]{color-scheme:light;--bg:#e8f3e9;--text:#20332a;--muted:#536b5d;--panel:rgba(248,255,247,.97);--line:#24493030;--hud:#f7fff0e8;--accent:#52d38a;--accentText:#10281b;--soft:#2e5b601c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;z-index:2;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}.pill{min-width:66px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--hud);text-align:center;backdrop-filter:blur(8px)}.pill small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.pill strong{display:block;font-size:19px}.top{position:fixed;z-index:4;right:12px;top:max(14px,env(safe-area-inset-top))}.ui,.btn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);background:var(--hud);font:700 13px system-ui;cursor:pointer}#shopButton{position:fixed;z-index:4;left:12px;top:max(14px,env(safe-area-inset-top));display:none}#shopButton.visible{display:block}.hint{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;color:var(--muted);font-size:12px;text-align:center;text-shadow:0 1px 5px #0005;pointer-events:none}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:16px;background:#050a1878;backdrop-filter:blur(6px)}html[data-theme=light] .overlay{background:#283a4328}.overlay.hidden,.hidden{display:none!important}.card{width:min(470px,100%);max-height:92vh;overflow:auto;padding:25px 22px 20px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 24px 80px #0005;text-align:center}.emoji{font-size:39px}h1{margin:7px 0;font-size:clamp(28px,7vw,39px);letter-spacing:-.04em}p{margin:0 auto 17px;color:var(--muted);line-height:1.5}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{border:0;background:var(--accent);color:var(--accentText);font-weight:800;transition:transform .12s}.btn:hover,.ui:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn span{display:block;margin-top:3px;font-size:10px;font-weight:600;opacity:.78}.btn.secondary{border:1px solid var(--line);background:var(--soft);color:var(--text)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.setting{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--soft);font-size:12px;font-weight:650}.setting input{accent-color:#42c97b}.upgrade-list{display:grid;gap:8px;margin:14px 0;text-align:left}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.upgrade small{display:block;margin-top:3px;color:var(--muted);line-height:1.3}.upgrade .btn{flex:none;padding:8px 9px;font-size:11px}.upgrade .btn:disabled{opacity:.55;cursor:default}@media(max-width:540px){.top{right:7px}#shopButton{left:7px}.pill{min-width:55px;padding:7px 7px}.pill strong{font-size:17px}.hint{font-size:11px}.card{padding:22px 15px 17px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Snake game. Steer with pointer or arrow keys."></canvas>
<div class="hud" aria-live="polite"><div class="pill"><small>Apples</small><strong id="score">0</strong></div><div class="pill"><small>Best</small><strong id="best">0</strong></div><div id="pointsPill" class="pill hidden"><small>Glow</small><strong id="points">0</strong></div></div>
<button class="ui" id="shopButton">✨ Buffs</button><div class="top"><button class="ui" id="themeButton">☀️ Light</button></div><div class="hint" id="hint"></div>
<div class="overlay" id="mainOverlay"><section class="card"><div class="emoji">🐍</div><h1 id="title">Slither Snack</h1><p id="message">Choose a game mode.</p>
<div class="buttons" id="modeButtons"><button class="btn" data-mode="fluid">Fluid Classic<span>Free steering, no hazards</span></button><button class="btn" data-mode="grid">Grid Classic<span>Big cells, three apples</span></button><button class="btn" id="wildSelect">Wild Grove<span>Choose your hazards</span></button></div>
<div id="wildSetup" class="hidden"><p>Choose hazards for this run:</p><div class="settings"><label class="setting"><input type="checkbox" data-hazard="meteors" checked> ☄️ Meteors</label><label class="setting"><input type="checkbox" data-hazard="trees" checked> 🌳 Trees</label><label class="setting"><input type="checkbox" data-hazard="bird" checked> 🦅 Hunting bird</label><label class="setting"><input type="checkbox" data-hazard="thorns"> 🌵 Thorns</label><label class="setting"><input type="checkbox" data-hazard="wind"> 💨 Gusts</label></div><div class="buttons"><button class="btn" id="startWild">Start Wild</button><button class="btn secondary" id="backModes">Back</button></div></div>
<div class="buttons hidden" id="resultActions"><button class="btn" id="again">Play again</button><button class="btn secondary" id="choose">Choose mode</button><button class="btn secondary hidden" id="deathShop">Spend glow</button></div></section></div>
<div class="overlay hidden" id="shopOverlay"><section class="card"><div class="emoji">✨</div><h1>Wild buffs</h1><p>Wild Grove apples earn glow points. Buffs persist between runs and never affect grid mode.</p><div class="upgrade-list" id="upgradeList"></div><button class="btn secondary" id="closeShop">Done</button></section></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const APPLE_R=14,GRID=36,SPACE=7,BASELEN=120;
const hazard={meteors:true,trees:true,bird:true,thorns:false,wind:false};
const buffDefs=[['dash','Comet dash',8,'Dash with Space/Shift; your body compresses during the burst.'],['thin','Little noodle',5,'Slimmer Wild Grove snake with a smaller collision radius.'],['magnet','Apple breeze',7,'Nearby apples gently drift toward you.'],['shield','Sturdy scales',12,'Survive one hazard or body collision per run.'],['longtail','Long starter',10,'Start Wild Grove with extra length and earn bonus glow.']];
let w=innerWidth,h=innerHeight,dpr=1,mode='fluid',running=false,last=0,score=0,best=0,glow=0,snake=null,apples=[],trees=[],thorns=[],meteors=[],bird=null,heading=-Math.PI/2,target=-Math.PI/2,keys={},eventClock=6,dash=0,dashWait=0,shield=false,gridBody=[],gridApples=[],gridDir={x:1,y:0},gridNext={x:1,y:0},gridClock=0,shopResume=false;
const pointer={x:w/2,y:h/2};
function load(k,f){try{let v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function adiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}
let buffs=load('slitherBuffs',{dash:false,thin:false,magnet:false,shield:false,longtail:false});if(!buffs||typeof buffs!=='object')buffs={dash:false,thin:false,magnet:false,shield:false,longtail:false};glow=Number(load('slitherGlowPoints',0))||0;best=Math.max(Number(load('slitherBestClassic',0))||0,Number(load('slitherBestWild',0))||0,Number(load('slitherBestGrid',0))||0,Number(load('slither-best',0))||0);$('best').textContent=best;$('points').textContent=glow;
document.documentElement.dataset.theme=load('slitherTheme','dark')==='light'?'light':'dark';
function themeLabel(){$('themeButton').textContent=document.documentElement.dataset.theme==='light'?'🌙 Dark':'☀️ Light';document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='light'?'#e8f3e9':'#101b2c'}themeLabel();
$('themeButton').onclick=()=>{let t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;save('slitherTheme',t);themeLabel()};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(snake){snake.x=clamp(snake.x,24,w-24);snake.y=clamp(snake.y,24,h-24)}if(mode==='grid'&&running)initGrid();if(mode==='wild'&&hazard.trees&&running)makeTrees()}addEventListener('resize',resize);resize();
function pointerSteer(e){pointer.x=e.clientX;pointer.y=e.clientY;if(running&&(mode==='fluid'||mode==='wild')&&snake){let dx=pointer.x-snake.x,dy=pointer.y-snake.y;if(Math.hypot(dx,dy)>20)target=Math.atan2(dy,dx)}}canvas.addEventListener('pointermove',pointerSteer);canvas.addEventListener('pointerdown',pointerSteer);
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(mode==='grid'&&running)setGridDirection(k);if(running&&mode==='wild'&&buffs.dash&&(k===' '||k==='shift')&&dashWait<=0){dash=1.05;dashWait=5}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
function spawnApple(){let a,tries=0;do{a={x:APPLE_R+Math.random()*Math.max(1,w-2*APPLE_R),y:APPLE_R+Math.random()*Math.max(1,h-2*APPLE_R),phase:Math.random()*6.28};tries++}while(tries<45&&((hazard.trees&&trees.some(t=>Math.hypot(a.x-t.x,a.y-t.y)<t.r+28))||(hazard.thorns&&thorns.some(t=>Math.hypot(a.x-t.x,a.y-t.y)<t.r+28))));return a}
function makeTrees(){trees=[];for(let i=0;i<Math.min(8,Math.floor(w*h/95000));i++){let x,y,n=0;do{x=35+Math.random()*Math.max(1,w-70);y=50+Math.random()*Math.max(1,h-100);n++}while(n<35&&(Math.hypot(x-w/2,y-h/2)<130||trees.some(t=>Math.hypot(x-t.x,y-t.y)<75)));trees.push({x,y,r:15+Math.random()*7})}}
function makeThorns(){thorns=[];for(let i=0;i<Math.min(7,Math.floor(w*h/115000));i++){let x,y,n=0;do{x=35+Math.random()*Math.max(1,w-70);y=50+Math.random()*Math.max(1,h-100);n++}while(n<30&&(Math.hypot(x-w/2,y-h/2)<145||thorns.some(t=>Math.hypot(x-t.x,y-t.y)<75)));thorns.push({x,y,r:19+Math.random()*7,phase:Math.random()*6})}}
function resetFluid(next){mode=next;score=0;$('score').textContent=0;heading=target=-Math.PI/2;let extra=mode==='wild'&&buffs.longtail?70:0,r=mode==='wild'&&buffs.thin?8:11;snake={x:w/2,y:h/2,radius:r,length:BASELEN+extra,distance:0,trail:[]};for(let i=0;i<=Math.ceil((snake.length+SPACE*4)/SPACE);i++){let b=i*SPACE;snake.trail.push({x:snake.x-Math.cos(heading)*b,y:snake.y-Math.sin(heading)*b,d:-b})}trees=[];thorns=[];meteors=[];bird=null;eventClock=6;dash=0;dashWait=0;shield=mode==='wild'&&buffs.shield;if(mode==='wild'){if(hazard.trees)makeTrees();if(hazard.thorns)makeThorns();if(hazard.bird)bird={x:w*.16,y:h*.17,r:17,phase:'stalk',timer:4.5}}apples=[];let n=clamp(Math.floor(w*h/56000),5,12);for(let i=0;i<n;i++)apples.push(spawnApple());$('pointsPill').classList.toggle('hidden',mode!=='wild');$('shopButton').classList.toggle('visible',mode==='wild');$('hint').textContent=mode==='wild'?'Pointer / keys to steer · Space/Shift dash if unlocked':'Move pointer to steer · Arrow keys / WASD also work'}
function initGrid(){let cols=Math.max(8,Math.floor(w/GRID)),rows=Math.max(8,Math.floor(h/GRID));if(!gridBody.length){let x=Math.floor(cols/2),y=Math.floor(rows/2);gridBody=[{x,y},{x:x-1,y},{x:x-2,y}];gridDir=gridNext={x:1,y:0}}while(gridApples.length<3)spawnGridApple(cols,rows);gridApples=gridApples.filter(a=>a.x<cols&&a.y<rows)}
function spawnGridApple(cols=Math.max(8,Math.floor(w/GRID)),rows=Math.max(8,Math.floor(h/GRID))){let p,n=0;do{p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};n++}while(n<200&&(gridBody.some(s=>s.x===p.x&&s.y===p.y)||gridApples.some(a=>a.x===p.x&&a.y===p.y)));return p}
function gridDirection(k){let dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]},d=dirs[k];if(d&&!(d[0]===-gridDir.x&&d[1]===-gridDir.y))gridNext={x:d[0],y:d[1]}}
function resetGrid(){mode='grid';score=0;$('score').textContent=0;gridBody=[];gridApples=[];gridClock=0;initGrid();$('pointsPill').classList.add('hidden');$('shopButton').classList.remove('visible');$('hint').textContent='Grid Snake · Arrow keys / WASD to turn · 3 apples at once'}
function start(next){running=true;last=performance.now();$('mainOverlay').classList.add('hidden');$('shopOverlay').classList.add('hidden');$('resultActions').classList.add('hidden');if(next==='grid')resetGrid();else resetFluid(next)}
function end(){if(!running)return;running=false;let key=mode==='wild'?'slitherBestWild':mode==='grid'?'slitherBestGrid':'slitherBestClassic',prev=Number(load(key,0))||0;if(score>prev)save(key,score);best=Math.max(best,prev,Number(load('slitherBestClassic',0))||0,Number(load('slitherBestWild',0))||0,Number(load('slitherBestGrid',0))||0);$('best').textContent=best;save('slither-best',best);let earned=mode==='wild'?score+(buffs.longtail?2:0):0;if(earned){glow+=earned;save('slitherGlowPoints',glow);$('points').textContent=glow}$('title').textContent=mode==='wild'?'Wild run over!':mode==='grid'?'Grid game over':'Snake bumped!';$('message').textContent=mode==='wild'?`You collected ${score} apples and earned ${earned} glow points.`:`You collected ${score} ${score===1?'apple':'apples'}. Want another round?`;$('modeButtons').classList.add('hidden');$('wildSetup').classList.add('hidden');$('resultActions').classList.remove('hidden');$('deathShop').classList.toggle('hidden',mode!=='wild');$('mainOverlay').classList.remove('hidden')}
function collision(){if(shield){shield=false;return false}end();return true}
function pointBack(b){let t=snake.distance-b;for(let i=0;i<snake.trail.length-1;i++){let a=snake.trail[i],c=snake.trail[i+1];if(a.d>=t&&c.d<=t){let q=(a.d-t)/Math.max(.001,a.d-c.d);return{x:a.x+(c.x-a.x)*q,y:a.y+(c.y-a.y)*q}}}return snake.trail[snake.trail.length-1]}
function meteor(){let x,y,n=0;do{x=35+Math.random()*Math.max(1,w-70);y=45+Math.random()*Math.max(1,h-90);n++}while(n<30&&Math.hypot(x-snake.x,y-snake.y)<Math.min(145,Math.min(w,h)*.25));meteors.push({x,y,r:clamp(Math.min(w,h)*.1,34,52),warn:1.8,flash:.45,hit:false})}
function updateBird(dt){bird.timer-=dt;let dx=snake.x-bird.x,dy=snake.y-bird.y,d=Math.hypot(dx,dy)||1;if(bird.phase==='stalk'&&bird.timer<=0){bird.phase='dive';bird.timer=1.2;bird.tx=snake.x;bird.ty=snake.y}if(bird.phase==='dive'){let x=bird.tx-bird.x,y=bird.ty-bird.y,n=Math.hypot(x,y)||1;bird.x+=x/n*250*dt;bird.y+=y/n*250*dt;if(bird.timer<=0){bird.phase='stalk';bird.timer=4+Math.random()*2}}else{bird.x+=dx/d*75*dt;bird.y+=dy/d*75*dt}if(Math.hypot(bird.x-snake.x,bird.y-snake.y)<bird.r+snake.radius){if(collision()){bird.x=clamp(bird.x-Math.cos(heading)*100,0,w);bird.y=clamp(bird.y-Math.sin(heading)*100,0,h);bird.phase='stalk';bird.timer=4}}}
function updateFluid(dt){let x=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),y=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(x||y)target=Math.atan2(y,x);heading+=clamp(adiff(heading,target),-5.2*dt,5.2*dt);dash=Math.max(0,dash-dt);dashWait=Math.max(0,dashWait-dt);let speed=(215+Math.min(score,35)*1.3)*(dash>0?1.75:1),ox=snake.x,oy=snake.y;snake.x+=Math.cos(heading)*speed*dt;snake.y+=Math.sin(heading)*speed*dt;snake.distance+=Math.hypot(snake.x-ox,snake.y-oy);snake.trail.unshift({x:snake.x,y:snake.y,d:snake.distance});while(snake.trail.length>2&&snake.distance-snake.trail.at(-1).d>snake.length+SPACE*5)snake.trail.pop();if(snake.x<snake.radius||snake.y<snake.radius||snake.x>w-snake.radius||snake.y>h-snake.radius){collision();return}
for(let b=32;b<Math.min(snake.length,snake.distance+snake.length);b+=10){let p=pointBack(b);if(Math.hypot(p.x-snake.x,p.y-snake.y)<snake.radius*1.48){if(collision())return;break}}
if(mode==='wild'){if(hazard.trees)for(const t of trees)if(Math.hypot(t.x-snake.x,t.y-snake.y)<t.r+snake.radius-2){if(collision())return;break}if(hazard.thorns)for(const t of thorns)if(Math.hypot(t.x-snake.x,t.y-snake.y)<t.r+snake.radius){if(collision())return;break}if(hazard.wind)target+=Math.sin(performance.now()*.0007)*.4*dt;if(hazard.meteors){eventClock-=dt;if(eventClock<=0){meteor();eventClock=8+Math.random()*5}for(let i=meteors.length-1;i>=0;i--){let m=meteors[i];if(!m.hit){m.warn-=dt;if(m.warn<=0){m.hit=true;if(Math.hypot(m.x-snake.x,m.y-snake.y)<m.r+snake.radius){if(collision())return}}}else if((m.flash-=dt)<=0)meteors.splice(i,1)}}if(hazard.bird&&bird)updateBird(dt)}
if(mode==='wild'&&buffs.magnet)for(const a of apples){let dx=snake.x-a.x,dy=snake.y-a.y,d=Math.hypot(dx,dy);if(d>snake.radius+APPLE_R&&d<155){a.x+=dx/d*75*dt;a.y+=dy/d*75*dt}}for(let i=apples.length-1;i>=0;i--)if(Math.hypot(apples[i].x-snake.x,apples[i].y-snake.y)<snake.radius+APPLE_R+3){apples.splice(i,1);score++;$('score').textContent=score;snake.length+=14;apples.push(spawnApple())}}
function updateGrid(dt){gridClock+=dt;if(gridClock<.13)return;gridClock-=.13;gridDir=gridNext;let cols=Math.max(8,Math.floor(w/GRID)),rows=Math.max(8,Math.floor(h/GRID)),head={x:gridBody[0].x+gridDir.x,y:gridBody[0].y+gridDir.y},ate=gridApples.some(a=>a.x===head.x&&a.y===head.y);if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||gridBody.some((p,i)=>i<(ate?gridBody.length:gridBody.length-1)&&p.x===head.x&&p.y===head.y)){end();return}gridBody.unshift(head);if(ate){score++;$('score').textContent=score;gridApples=gridApples.filter(a=>a.x!==head.x||a.y!==head.y);while(gridApples.length<3)gridApples.push(spawnGridApple(cols,rows))}else gridBody.pop()}
function drawApple(a,t){ctx.save();ctx.translate(a.x,a.y+Math.sin(t*.003+a.phase)*1.5);ctx.scale(1.4,1.4);ctx.shadowColor='#ff3e59';ctx.shadowBlur=14;ctx.fillStyle='#ed4055';ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-4,6,-12,0,-10,-6);ctx.bezierCurveTo(-9,-12,-2,-12,0,-7);ctx.bezierCurveTo(3,-13,10,-11,11,-5);ctx.bezierCurveTo(13,1,4,8,0,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff9da5';ctx.beginPath();ctx.ellipse(-4,-5,2,3.8,-.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#72cf78';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(1,-14,5,-13);ctx.stroke();ctx.restore()}
function drawHazards(t){if(hazard.trees)for(const o of trees){ctx.fillStyle='#67452f';ctx.fillRect(o.x-4,o.y,8,17);ctx.fillStyle='#1f754a';ctx.beginPath();ctx.arc(o.x,o.y-5,o.r,0,7);ctx.fill();ctx.fillStyle='#39a464';ctx.beginPath();ctx.arc(o.x-5,o.y-9,o.r*.58,0,7);ctx.fill()}if(hazard.thorns)for(const o of thorns){ctx.fillStyle='#547b42';ctx.beginPath();ctx.ellipse(o.x,o.y,o.r,o.r*.65,0,0,7);ctx.fill();ctx.strokeStyle='#c2df70';ctx.lineWidth=3;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(o.x+Math.cos(a)*o.r*.6,o.y+Math.sin(a)*o.r*.5);ctx.lineTo(o.x+Math.cos(a)*(o.r+8),o.y+Math.sin(a)*(o.r+8));ctx.stroke()}}if(hazard.meteors)for(const m of meteors){if(!m.hit){ctx.fillStyle='rgba(255,58,67,.18)';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();ctx.strokeStyle='#ff646b';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('METEOR!',m.x,m.y+4)}else{ctx.fillStyle=`rgba(255,119,45,${Math.max(0,m.flash*1.5)})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill()}}if(hazard.bird&&bird){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.atan2(snake.y-bird.y,snake.x-bird.x));ctx.fillStyle='#f0c66f';ctx.beginPath();ctx.ellipse(0,0,17,11,0,0,7);ctx.fill();ctx.fillStyle='#9a6b45';ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-17,-22,-25,-10);ctx.quadraticCurveTo(-11,-9,-2,4);ctx.fill();ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-17,22,-25,10);ctx.quadraticCurveTo(-11,9,-2,-4);ctx.fill();ctx.fillStyle='#ed8550';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(24,3);ctx.lineTo(14,5);ctx.fill();ctx.restore();if(bird.phase==='dive'){ctx.strokeStyle='#ff646b88';ctx.beginPath();ctx.arc(bird.tx,bird.ty,22,0,7);ctx.stroke()}}}
function drawSnake(t){let compress=dash>0?.58:1,count=Math.ceil(snake.length*compress/SPACE),pts=[];for(let i=0;i<=count;i++){let b=i*SPACE/compress,p=pointBack(b),q=pointBack(b+2),r=pointBack(Math.max(0,b-2)),dx=q.x-r.x,dy=q.y-r.y,n=Math.hypot(dx,dy)||1,wave=Math.sin(b*.055-t*.003)*1.1*Math.min(1,b/18);pts.push({x:p.x-dy/n*wave,y:p.y+dx/n*wave})}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineCap='round';ctx.lineJoin='round';let thin=mode==='wild'&&buffs.thin;ctx.strokeStyle=mode==='wild'?'#14768b':'#147c58';ctx.lineWidth=thin?20:26;ctx.stroke();ctx.strokeStyle=mode==='wild'?'#63d8ee':'#42d996';ctx.lineWidth=thin?14:19;ctx.stroke();ctx.globalAlpha=.35;ctx.strokeStyle='#e2fff0';ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;ctx.save();ctx.translate(snake.x,snake.y);ctx.rotate(heading);ctx.fillStyle=mode==='wild'?'#70def2':'#63efa6';ctx.beginPath();ctx.ellipse(0,0,snake.radius+3,snake.radius+1,0,0,7);ctx.fill();for(const s of [-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(4,s*5,3,3.6,0,0,7);ctx.fill();ctx.fillStyle='#173626';ctx.beginPath();ctx.arc(5,s*5,1.5,0,7);ctx.fill()}ctx.restore();if(shield){ctx.strokeStyle='#78dfff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(snake.x,snake.y,22,0,7);ctx.stroke()}}
function drawGrid(){let cols=Math.max(8,Math.floor(w/GRID)),rows=Math.max(8,Math.floor(h/GRID)),light=document.documentElement.dataset.theme==='light';ctx.fillStyle=light?'#e8f3e9':'#101b2c';ctx.fillRect(0,0,w,h);ctx.strokeStyle=light?'#285c361c':'#d9e8ff18';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*GRID,0);ctx.lineTo(x*GRID,rows*GRID);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*GRID);ctx.lineTo(cols*GRID,y*GRID);ctx.stroke()}ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${GRID*.68}px serif`;for(const a of gridApples)ctx.fillText('🍎',(a.x+.5)*GRID,(a.y+.5)*GRID);gridBody.forEach((p,i)=>{let pad=i===0?2:4;ctx.fillStyle=i===0?'#62e99d':'#39c982';ctx.beginPath();ctx.roundRect(p.x*GRID+pad,p.y*GRID+pad,GRID-pad*2,GRID-pad*2,i===0?9:6);ctx.fill()})}
function draw(t){let light=document.documentElement.dataset.theme==='light';ctx.fillStyle=mode==='grid'?(light?'#e8f3e9':'#101b2c'):(light?'#dceede':'#112139');ctx.fillRect(0,0,w,h);if(mode==='grid'){drawGrid();return}ctx.fillStyle=light?'#285c3614':'#d9e8ff13';for(let y=19;y<h;y+=38)for(let x=19;x<w;x+=38){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}if(mode==='wild')drawHazards(t);for(const a of apples)drawApple(a,t);if(snake)drawSnake(t);if(mode==='wild'&&buffs.dash&&running){ctx.fillStyle=light?'#20332a':'#fff';ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.fillText(dash>0?'BODY COMPRESSED · DASH':dashWait>0?`Dash in ${dashWait.toFixed(1)}s`:'Dash · Space / Shift',12,h-42)}}
function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(running){if(mode==='grid')updateGrid(dt);else updateFluid(dt)}draw(t);requestAnimationFrame(frame)}
function shop(){shopResume=running;running=false;renderShop();$('shopOverlay').classList.remove('hidden')}function renderShop(){let list=$('upgradeList');list.replaceChildren();for(const [id,name,cost,desc] of buffDefs){let row=document.createElement('div'),info=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),button=document.createElement('button');row.className='upgrade';strong.textContent=name;small.textContent=desc;info.append(strong,small);button.className='btn';button.disabled=!!buffs[id]||glow<cost;button.textContent=buffs[id]?'Unlocked ✓':`Unlock ${cost} ✨`;button.onclick=()=>{if(glow<cost)return;glow-=cost;buffs[id]=true;save('slitherBuffs',buffs);save('slitherGlowPoints',glow);$('points').textContent=glow;renderShop()};row.append(info,button);list.append(row)}}
$('shopButton').onclick=shop;$('deathShop').onclick=shop;$('closeShop').onclick=()=>{$('shopOverlay').classList.add('hidden');if(shopResume){running=true;last=performance.now()}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('wildSelect').onclick=()=>{$('modeButtons').classList.add('hidden');$('wildSetup').classList.remove('hidden');$('title').textContent='Wild Grove';$('message').textContent='Choose your hazards for this run.'};$('startWild').onclick=()=>{document.querySelectorAll('[data-hazard]').forEach(c=>hazard[c.dataset.hazard]=c.checked);start('wild')};$('backModes').onclick=()=>{$('wildSetup').classList.add('hidden');$('modeButtons').classList.remove('hidden');$('title').textContent='Slither Snack';$('message').textContent='Choose a game mode.'};$('again').onclick=()=>mode==='wild'?($('resultActions').classList.add('hidden'),$('wildSetup').classList.remove('hidden'),$('title').textContent='Wild Grove',$('message').textContent='Choose your hazards for this run.'):start(mode);$('choose').onclick=()=>{$('resultActions').classList.add('hidden');$('modeButtons').classList.remove('hidden');$('wildSetup').classList.add('hidden');$('title').textContent='Slither Snack';$('message').textContent='Choose a game mode.'};
resetFluid('fluid');requestAnimationFrame(frame);
})();
